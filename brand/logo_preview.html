.grid{display:grid;grid-template-columns:1fr 1fr;width:1600px}
.cell{height:520px;display:grid;place-items:center;position:relative}
.cap{position:absolute;left:24px;bottom:18px;font:500 14px/1 Golos;opacity:.55;color:inherit}
.lock-h{display:flex;align-items:center;gap:22px} .lock-h svg{width:150px;height:100px}

.lock-v{display:grid;justify-items:center;gap:10px} .lock-v svg{width:190px;height:127px}
.wm1{font:400 46px/1.05 Prata;letter-spacing:-.01em}
.sub{margin-top:10px;font:500 15px/1 Golos;letter-spacing:.14em;text-transform:uppercase}
.frost{background:radial-gradient(120% 90% at 50% 50%,#3d5a7a 0%,#24384f 55%,#152536 100%)}

.deg{position:absolute;right:60px;top:50%;transform:translateY(-50%);font:600 96px/1 Sofia;color:#EAF1F7}
.prog{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font:500 13px/1 Golos;letter-spacing:.14em;text-transform:uppercase;color:#A9BDCC}
.small{display:flex;gap:40px;align-items:center} .small svg{display:block}
